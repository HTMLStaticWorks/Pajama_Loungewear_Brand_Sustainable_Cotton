<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Lumiere</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="assets/js/theme-init.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <style>
        body {
            background-color: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }
        .auth-card {
            background: white;
            padding: 60px;
            border-radius: 40px;
            box-shadow: 0 30px 100px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            text-align: center;
            animation: authPopup 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes authPopup {
            from { opacity: 0; transform: scale(0.9) translateY(40px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .form-group { text-align: left; margin-bottom: 25px; position: relative; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 600; font-size: 0.9rem; color: var(--text-light); }
        .form-group input { width: 100%; padding: 16px 20px; border-radius: 15px; border: 1px solid #eee; background: #fdfdfd; outline: none; transition: var(--transition); }
        .form-group input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(212, 163, 115, 0.1); }
        
        .password-toggle { position: absolute; right: 20px; top: 50px; cursor: pointer; color: #aaa; transition: var(--transition); }
        .password-toggle:hover { color: var(--primary); }

        .auth-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; font-size: 0.85rem; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .checkbox-group input { cursor: pointer; }

        .social-login { margin-top: 40px; border-top: 1px solid #eee; padding-top: 30px; }
        .social-icons { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .social-btn { width: 50px; height: 50px; border-radius: 50%; border: 1px solid #eee; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: var(--transition); cursor: pointer; color: var(--text-dark); }
        .social-btn:hover { background: var(--bg-light); border-color: var(--primary); color: var(--primary); transform: translateY(-5px); }

        .auth-btn { width: 100%; padding: 16px; font-size: 1rem; }

        @media (max-width: 480px) {
            .auth-card { padding: 40px 25px; }
            .auth-options { font-size: 0.75rem; }
            .checkbox-group { gap: 5px; }
            .auth-options a { white-space: nowrap; }
        }
    </style>
</head>
<body style="position: relative;">
    <div class="auth-actions">
        <button class="icon-btn theme-toggle"><i class="fas fa-moon"></i></button>
        <button class="icon-btn rtl-toggle">RTL</button>
    </div>
    <div class="auth-card">
        <a href="index.html" class="logo-brand" style="justify-content: center; margin-bottom: 40px; font-size: 2.2rem;">
            <i class="fas fa-leaf"></i>
            <span>Lumiere</span>
        </a>
        <h2 style="margin-bottom: 10px;">Welcome Back</h2>
        <p style="color: var(--text-light); margin-bottom: 40px;">Sign in to your account</p>
        
        <form id="loginForm" action="#">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
                <i class="fas fa-eye password-toggle" id="togglePassword"></i>
            </div>
            
            <div class="auth-options">
                <label class="checkbox-group">
                    <input type="checkbox" id="remember"> Remember Me
                </label>
                <a href="#" style="color: var(--primary); font-weight: 600;">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary auth-btn">Sign In</button>
        </form>

        <div class="social-login">
            <p style="font-size: 0.8rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px;">Or continue with</p>
            <div class="social-icons">
                <div class="social-btn" title="Google"><i class="fab fa-google"></i></div>
                <div class="social-btn" title="Facebook"><i class="fab fa-facebook-f"></i></div>
                <div class="social-btn" title="Apple"><i class="fab fa-apple"></i></div>
            </div>
        </div>
        
        <div style="margin-top: 40px; font-size: 0.95rem;">
            Don't have an account? <a href="signup.html" style="color: var(--primary); font-weight: 700;">Sign Up</a>
        </div>
    </div>

    <script>
        // Password Visibility Toggle
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function() {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        // Simple Form Submission
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Show a simple success message
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Signing in...';
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        });
    </script>
    <script src="assets/js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coming Soon | Lumiere Sleep</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <style>
        body { background-color: var(--bg-dark); color: white; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .timer { display: flex; gap: 30px; justify-content: center; margin: 50px 0; }
        .timer-item { text-align: center; }
        .timer-item span { display: block; font-size: 3rem; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <h3 style="text-transform: uppercase; letter-spacing: 5px; color: var(--primary-color);">Launching Soon</h3>
        <h1 style="font-size: 3.5rem; margin: 20px 0;">Our New Sustainable Collection is Dreaming...</h1>
        <div class="timer">
            <div class="timer-item"><span>12</span><p>Days</p></div>
            <div class="timer-item"><span>08</span><p>Hours</p></div>
            <div class="timer-item"><span>45</span><p>Mins</p></div>
        </div>
        <form style="display: flex; gap: 10px; margin-top: 50px;">
            <input type="email" placeholder="Get notified on launch" style="flex: 1; padding: 15px 25px; border-radius: 50px; border: none; outline: none;">
            <button class="btn btn-primary">Notify Me</button>
        </form>
    </div>
</body>
</html>
